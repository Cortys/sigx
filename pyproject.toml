[project]
name = "sigx"
dynamic = ["version"]
description = "A pyi stub generator for typing complex function decorators."
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "joblib>=1.5.0",
    "libcst>=1.6.0",
]

[project.scripts]
sigx-gen = "sigx_gen.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["./src"]
include = ["sigx*", "sigx_gen*"]

[tool.setuptools.dynamic]
version = { attr = "sigx.__version__" }
readme = { file = [
    "README.md",
    "CHANGELOG.md",
], content-type = "text/markdown" }

[dependency-groups]
test = [
    "pytest>=8.3.5",       # for testing
    "pytest-cov>=6.0.0",   # for coverage
    "pytest-xdist>=3.6.1", # for parallel testing
    "packaging",           # for version parsing
]
lint = [
    "ruff>=0.15.8", # for linting
    "ty>=0.0.26",   # for static type checking
]
dev = [
    "ipykernel>=6.29.5",
    "notebook>=7.3.3",
    "ipywidgets",
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.ruff]
line-length = 120
target-version = "py313"
output-format = "full"
force-exclude = true
extend-exclude = ["**/*.pyi"]


[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "N812",    # Checks for lowercase imports that are aliased to non-lowercase names (e.g. torch.nn.functional as F)
    "RET504",  # Unnecessary assignment to {name} before return statement
    "PLR2004", # Magic value used in comparison, consider replacing {value} with a constant variable
    "PLR0912", # branch complexity is acceptable in orchestration functions
    "FBT",     # enforce keyword for bool
    "PLR0913", # too many arguments (>5)
    "FIX002",  # TODOs are fine in code
    "C901",    # complexity is acceptable for orchestrator flow
    "TRY003",  # explicit inline exception messages are acceptable
    "TRY004",  # ValueError is acceptable for invalid values
    "TRY301",  # direct raise statements are acceptable
    "EM101",   # direct string literals in exceptions are acceptable
    "EM102",   # f-string literals in exceptions are acceptable
    "TCH",     # avoid forcing TYPE_CHECKING-only imports
    "COM812",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
    "S108",
    "S603",
    "S607",
    "INP001",
    "D101",
    "D102",
    "D103",
    "D404",
    "ANN001",
    "ANN201",
    "ANN202",
    "ARG001",
    "FBT001",
    "D100",
    "PLR2004",
    "PD901",
    "TCH",
    "N803",
    "C901",
]
"tests/fixtures/**/*.py" = [
    "ARG001",
    "ARG002",
    "D100",
    "D104",
    "INP001",
]
"src/sigx_gen/emit/patch_libcst.py" = [
    "ANN401",
    "ARG002",
    "F841",
    "N802",
    "PERF401",
]
"src/sigx_gen/bootstrap/source_stubs.py" = [
    "ANN401",
    "N802",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

# Use isort-compatible settings
[tool.ruff.lint.isort]
known-first-party = ["sigx", "sigx_gen"]
force-sort-within-sections = true
combine-as-imports = true
force-single-line = false
no-lines-before = ["future"]
extra-standard-library = ["typing_extensions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
minversion = "8.0"
addopts = [
    "--import-mode=importlib", # to avoid issues with lazy imports
]
